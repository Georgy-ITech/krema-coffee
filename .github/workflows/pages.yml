name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, а не ci: lock-файл собран на Windows, и в нём нет пакетов,
      # которые нужны сборщику только на Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Внутренние адреса (/info/about, /checkout) для GitHub Pages — несуществующие файлы;
      # 404.html с тем же приложением открывает их, дальше маршрут разбирает React Router.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
